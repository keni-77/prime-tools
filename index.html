<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="description" content="素因数分解、n番目の素数、n以下の素数の個数を高速で計算できるツールです。">
  <meta charset="UTF-8">
  <title>Prime</title>
  <link rel="icon" href="https://keni-77.github.io/icon.ico">
<style>
/* ===== 全体 ===== */
body {
  background-color: #fff5f8;
  font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  text-align: center;
  padding-top: 50px;
  color: #444;
}

/* ===== タイトル ===== */
h2 {
  color: #ff7aa8;
  font-size: 2rem;
  margin-bottom: 20px;
}

/* ===== 入力欄 ===== */
#num {
  padding: 10px 15px;
  font-size: 1.2rem;
  border: 2px solid #ffb6d4;
  border-radius: 12px;
  outline: none;
  width: 260px;
  background: #fff;
  transition: 0.2s;
}

#num:focus {
  border-color: #ff7aa8;
  box-shadow: 0 0 5px #ffb6d4;
}

/* ===== メインカード ===== */
.box {
  background: snow;
  display: inline-block;
  padding: 30px 40px;
  border-radius: 20px;
  box-shadow: 0 4px 12px rgba(255, 150, 180, 0.5);
  margin-top: 20px;
}

/* ===== ボタン（メイン） ===== */
.box button {
  padding: 10px 20px;
  font-size: 1.1rem;
  background-color: #ff9ecb;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  color: white;
  transition: 0.2s;
  margin: 6px;
}

.box button:hover {
  background-color: #ff7aa8;
  transform: scale(1.05);
}

/* リセットボタン */
.reset {
  background-color: silver !important;
}
.reset:hover {
  background-color: red !important;
}

/* ===== 結果表示 ===== */
#result {
  font-family: "Segoe UI", "Arial", sans-serif;
  line-height: 1.6;
  font-size: 1.5rem;
  color: hotpink;
  word-break: break-all;
}

/* ===== ボタンの光るアニメ ===== */
button.glow {
  animation: popGlow 0.25s ease-out;
}

@keyframes popGlow {
  0% { transform: scale(1); box-shadow: 0 0 0px rgba(255, 150, 200, 0.0); }
  50% { transform: scale(1.12); box-shadow: 0 0 15px rgba(255, 150, 200, 0.6); }
  100% { transform: scale(1); box-shadow: 0 0 0px rgba(255, 150, 200, 0.0); }
}

/* ===== ローダー ===== */
.loader {
  display: none;
  margin: 20px auto;
  width: 60px;
  height: 60px;
  position: relative;
}

.loader span {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2.5rem;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to   { transform: translate(-50%, -50%) rotate(360deg); }
}

/* ===== 左上のメニューボタン ===== */
#menuButton {
  position: fixed;
  top: 15px;
  left: 15px;
  background: #ff9ecb;
  color: white;
  font-size: 1.8rem;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  z-index: 1000;
  box-shadow: 0 3px 8px rgba(255, 150, 180, 0.4);
  transition: 0.2s;
}

#menuButton:hover {
  background: #ff7aa8;
  transform: scale(1.05);
}

/* ===== スライドメニュー ===== */
#sideMenu {
  position: fixed;
  top: 0;
  left: -250px;
  width: 250px;
  height: 100%;
  background: snow;
  box-shadow: 3px 0 10px rgba(0,0,0,0.2);
  padding: 20px;
  transition: 0.3s;
  z-index: 999;
  border-radius: 0 15px 15px 0;
}

#sideMenu h3 {
  color: #ff7aa8;
  margin-bottom: 15px;
}

/* ===== ボタン（メニュー） ===== */
#sideMenu button {
  background-color: #ff9ecb !important;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 10px 20px;
  font-size: 1.1rem;
  cursor: pointer;
  transition: 0.2s;
}

#sideMenu button:hover {
  background-color: #ff7aa8 !important;
  transform: scale(1.05);
}
/* ===== オーバーレイ ===== */
#menuOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.3);
  display: none;
  z-index: 500;
}

/* ===== スマホ ===== */
@media (max-width: 600px) {
  body { padding-top: 20px; }

  .box {
    width: 95%;
    padding: 20px 15px;
    border-radius: 15px;
  }

  h2 { font-size: 1.6rem; }

  #num {
    width: 90%;
    font-size: 1.1rem;
  }

  .box button {
    display: block;
    width: 90%;
    margin: 8px auto;
    padding: 12px 0;
  }

  #result { font-size: 1.3rem; }
}
  </style>
</head>
<body>
  
<!-- メニューボタン -->
<div id="menuButton">≡</div>

<!-- スライドメニュー -->
<div id="sideMenu">
  <h3>🌸 メニュー 🌸</h3>
  <a href="prime-game.html" target="_blank" rel="noopener noreferrer">
    <button type="button">🔫素数シューティング</button>
  </a>
</div>

<!-- メニュー展開時の背景 -->
<div id="menuOverlay"></div>

<div class="box">
  <div id="userInfo"></div>
  <h2>🌸 素数に関するツール 🌸</h2>

  <input id="num" type="text" placeholder="整数を入力してね">
  <button onclick="run()" type="button">素因数分解</button>
  <button onclick="runNthPrime()" type="button">n番目の素数</button>
  <button onclick="runCountPrime()" type="button">n以下の素数の個数</button>
  <button onclick="runSumPrime()" type="button">n以下の素数の和</button>
  <button onclick="resetAll()" class="reset" type="button">リセット</button>

  <p id="result"></p>

  <div class="loader" id="loader">
    <span>🌸</span>
  </div>

</div>

<script>
// 素因数分解コード
function printPrimeFactorization(inputStr) {
  // BigInt に変換
  let n;
  try {
    n = BigInt(inputStr);
  } catch {
    return "🌸 正しい整数を入力してね 🌸";
  }

  const sup = ["⁰","¹","²","³","⁴","⁵","⁶","⁷","⁸","⁹"];
  const toSup = (x) => String(x).split("").map(c => sup[Number(c)]).join("");

  // 1以下ならエラー
  if (n <= 1n) {
    return `🌸 ${n} は素因数分解できません 🌸`;
  }

  // 素数チェック
  function isPrime(x) {
    if (x <= 1n) return false;
    for (let i = 2n; i * i <= x; i++) {
      if (x % i === 0n) return false;
    }
    return true;
  }

  if (isPrime(n)) {
    return `🌸 ${n} は素数です 🌸`;
  }

  // 素因数分解
  let original = n;
  let res = [];

  for (let i = 2n; i * i <= n; i++) {
    if (n % i === 0n) {
      let ex = 0;
      while (n % i === 0n) {
        ex++;
        n /= i;
      }
      res.push([i, ex]);
    }
  }

  if (n !== 1n) {
    res.push([n, 1]);
  }

  let output = `${original} = `;
  output += res.map(([p, e]) => {
    return e === 1 ? `${p}` : `${p}${toSup(e)}`;
  }).join(" × ");

  return output;
}

function run() {
  const btn = document.querySelector("button[onclick='run()']");
  const loader = document.getElementById("loader");
  const result = document.getElementById("result");

  // 光る演出
  btn.classList.add("glow");
  setTimeout(() => btn.classList.remove("glow"), 250);

  const inputStr = document.getElementById("num").value.trim();

  // ロード中表示
  result.textContent = "⏳ ロード中…";
  loader.style.display = "block";

  // UI更新のため少し遅らせて計算開始
  setTimeout(() => {
    result.textContent = printPrimeFactorization(inputStr);
    loader.style.display = "none"; // 終わったら消す
  }, 50);
}

// 安定版 n番目の素数（通常のエラトステネスの篩）
async function nthPrimeUltra(n) {
  n = Number(n);
  if (!Number.isInteger(n) || n < 1) {
    return "🌸 1以上の整数を入れてね 🌸";
  }

  if (n === 1) {
    return "🌸 1番目の素数は 2 です 🌸";
  }

  // 上限の目安：p_n < n (log n + log log n) （n >= 6 のとき）
  let limit;
  if (n < 6) {
    limit = 15;
  } else {
    const ln = Math.log(n);
    limit = Math.ceil(n * (ln + Math.log(ln))) + 10;
  }

  const isComposite = new Uint8Array(limit + 1);
  let count = 0;

  for (let i = 2; i <= limit; i++) {
    if (!isComposite[i]) {
      count++;
      if (count === n) {
        return `🌸 ${n} 番目の素数は ${i} です 🌸`;
      }
      // i*i からで十分
      if (i * i <= limit) {
        for (let j = i * i; j <= limit; j += i) {
          isComposite[j] = 1;
        }
      }
    }

    // 重くなりすぎないように小休止
    if (i % 100000 === 0) {
      await new Promise(r => setTimeout(r));
    }
  }

  return "🌸 範囲が足りませんでした（nが大きすぎるかも）🌸";
}

function runNthPrime() {
  const btn = document.querySelector("button[onclick=\"runNthPrime()\"]");
  const loader = document.getElementById("loader");
  const result = document.getElementById("result");
  const inputStr = document.getElementById("num").value.trim();

  btn.classList.add("glow");
  setTimeout(() => btn.classList.remove("glow"), 250);

  result.textContent = "⏳ ロード中…";
  loader.style.display = "block";

  setTimeout(async () => {
    result.textContent = await nthPrimeUltra(inputStr);
    loader.style.display = "none";
  }, 50);
}

async function countPrimesUnder(n) {
  n = Number(n);
  if (!Number.isInteger(n) || n < 2) {
    return "🌸 2以上の整数を入れてね 🌸";
  }

  // n 以下の素数の個数 π(n) を求める
  const limit = n;
  const isComposite = new Uint8Array(limit + 1);
  let count = 0;

  for (let i = 2; i <= limit; i++) {
    if (!isComposite[i]) {
      count++;

      // i*i からで十分
      if (i * i <= limit) {
        for (let j = i * i; j <= limit; j += i) {
          isComposite[j] = 1;
        }
      }
    }

    // UI を止めない
    if (i % 200000 === 0) {
      await new Promise(r => setTimeout(r));
    }
  }

  return `🌸 ${n} 以下の素数の個数は ${count} 個です 🌸`;
}

function runCountPrime() {
  const btn = document.querySelector("button[onclick=\"runCountPrime()\"]");
  const loader = document.getElementById("loader");
  const result = document.getElementById("result");
  const inputStr = document.getElementById("num").value.trim();

  btn.classList.add("glow");
  setTimeout(() => btn.classList.remove("glow"), 250);

  result.textContent = "⏳ ロード中…";
  loader.style.display = "block";

  setTimeout(async () => {
    result.textContent = await countPrimesUnder(inputStr);
    loader.style.display = "none";
  }, 50);
}

async function sumPrimesUnder(n) {
  n = Number(n);
  if (!Number.isInteger(n) || n < 2) {
    return "🌸 2以上の整数を入れてね 🌸";
  }

  const limit = n;
  const isComposite = new Uint8Array(limit + 1);
  let sum = 0;

  for (let i = 2; i <= limit; i++) {
    if (!isComposite[i]) {
      sum += i;

      // i*i からで十分
      if (i * i <= limit) {
        for (let j = i * i; j <= limit; j += i) {
          isComposite[j] = 1;
        }
      }
    }

    // UI を止めない
    if (i % 200000 === 0) {
      await new Promise(r => setTimeout(r));
    }
  }

  return `🌸 ${n} 以下の素数の和は ${sum} です 🌸`;
}

function runSumPrime() {
  const btn = document.querySelector("button[onclick=\"runSumPrime()\"]");
  const loader = document.getElementById("loader");
  const result = document.getElementById("result");
  const inputStr = document.getElementById("num").value.trim();

  btn.classList.add("glow");
  setTimeout(() => btn.classList.remove("glow"), 250);

  result.textContent = "⏳ ロード中…";
  loader.style.display = "block";

  setTimeout(async () => {
    result.textContent = await sumPrimesUnder(inputStr);
    loader.style.display = "none";
  }, 50);
}

// リセットボタン 上に追記
function resetAll() {
  const input = document.getElementById("num");
  const result = document.getElementById("result");
  const loader = document.getElementById("loader");

  input.value = "";          // 入力欄を空に
  result.textContent = "";   // 結果を消す
  loader.style.display = "none"; // ローダーを消す
}

// メニュー開閉
const menuButton = document.getElementById("menuButton");
const sideMenu = document.getElementById("sideMenu");
const menuOverlay = document.getElementById("menuOverlay");

menuButton.onclick = () => {
  sideMenu.style.left = "0";
  menuOverlay.style.display = "block";
};

menuOverlay.onclick = () => {
  sideMenu.style.left = "-250px";
  menuOverlay.style.display = "none";
};

</script>
</body>
</html>
